
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильмы — CINEMA</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/movies.css">
</head>

<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">CINE<span>MA.</span></div>

            <div class="nav-links">
                <a href="main.html">Главная</a>
                <a href="movies.html">Фильмы</a>
                <a href="schedule.html">Расписание</a>
                <a href="about.html">О кинотеатре</a>
            </div>
        </nav>
    </div>
</header>

<main>
    <div class="container">

        <div class="catalog-header">
            <div class="hero-label">НАШ РЕПЕРТУАР</div>
            <h1>КАТАЛОГ ФИЛЬМОВ</h1>
            <p>Выбирайте фильм и приходите смотреть его на большом экране.</p>
        </div>

        <div class="catalog-controls">
            <input
                type="text"
                id="search"
                placeholder="Поиск фильма..."
            >

            <select id="genre">
                <option value="all">Все жанры</option>
                <option value="Фантастика">Фантастика</option>
                <option value="Триллер">Триллер</option>
                <option value="Боевик">Боевик</option>
                <option value="Драма">Драма</option>
            </select>
        </div>

        <div class="catalog-grid" id="catalog"></div>

        <div class="empty-result" id="empty">
            Фильмы не найдены.
        </div>

    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-content">
            <div>© 2026 CINEMA. Все права защищены.</div>
            <div>КИНО НАЧИНАЕТСЯ ЗДЕСЬ.</div>
        </div>
    </div>
</footer>


<script src="scripts/lists.js"></script>
<script src="scripts/movies.js"></script>
</body>
</html>
