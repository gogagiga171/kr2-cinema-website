<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Выбор мест — CINEMA</title>

    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/seats.css">
</head>
<body>

<header>
    <div class="container">
        <nav>
            <div class="logo">CINE<span>MA.</span></div>

            <div class="nav-links">
                <a href="main.html">Главная</a>
                <a href="movies.html">Фильмы</a>
                <a href="schedule.html">Расписание</a>
                <a href="about.html">О кинотеатре</a>
            </div>
        </nav>
    </div>
</header>

<main>
    <div class="container">

        <a href="schedule.html" class="back-link">
            ← НАЗАД К РАСПИСАНИЮ
        </a>

        <div id="session-info"></div>

        <section class="hall-section">

            <h2>Выберите места</h2>

            <div class="legend">
                <div>
                    <span class="legend-seat available"></span>
                    Свободно
                </div>

                <div>
                    <span class="legend-seat occupied"></span>
                    Занято
                </div>
            </div>

            <div class="screen">
                ЭКРАН
            </div>

            <div id="hall" class="hall"></div>

        </section>

    </div>
</main>

<!-- ФОРМА ПОКУПКИ -->

<div id="purchase-modal" class="modal hidden">

    <div class="modal-content">

        <button id="close-modal" class="close-modal">
            ×
        </button>

        <h2>Оформление билета</h2>

        <div id="selected-seat"></div>

        <form id="purchase-form">

            <div class="form-group">
                <label for="buyer-name">Ваше имя</label>

                <input
                    type="text"
                    id="buyer-name"
                    maxlength="50"
                    required
                    placeholder="Введите имя"
                >
            </div>

            <div class="form-group">
                <label for="buyer-email">Электронная почта</label>

                <input
                    type="email"
                    id="buyer-email"
                    required
                    placeholder="example@mail.com"
                >
            </div>

            <div class="purchase-info">
                <span>Стоимость билета</span>
                <strong id="ticket-price"></strong>
            </div>

            <button type="submit" class="purchase-button">
                Оформить билет
            </button>

            <p id="purchase-message"></p>

        </form>

    </div>

</div>

<footer>
    <div class="container">
        <div class="footer-content">
            <div>© 2026 CINEMA. Все права защищены.</div>
            <div>КИНО НАЧИНАЕТСЯ ЗДЕСЬ.</div>
        </div>
    </div>
</footer>

<script src="scripts/lists.js"></script>
<script src="scripts/seats.js"></script>

</body>
</html>
